name: Cleanup Releases
on:
  push:
    branches:
      - main

jobs:
  delete-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete GitHub Releases
        run: |
          RELEASES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases" | jq -r '.[].id')
          for rel_id in $RELEASES; do
            echo "Deleting release ID $rel_id..."
            curl -s -X DELETE \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$rel_id"
          done
          echo "All releases removed."
